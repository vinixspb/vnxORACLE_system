# =========================================================
# vnxORACLE Web API — блок для Caddy на MATRIXde-n1
# =========================================================
# Куда добавлять: /opt/caddy/Caddyfile — именно его монтирует контейнер
# caddy-selfsteal. Файл /etc/caddy/Caddyfile на хосте НЕ читается никем.
#
# Схема сервера:
#   • порт 443 занят контейнером mtg-proxy (MTProto VPN) — не трогать
#   • Caddy живёт в контейнере caddy-selfsteal с network_mode: host
#   • TLS для публичных сайтов терминируется на Cloudflare, поэтому блоки
#     объявляются как http:// — сертификат на сервере не нужен
#
# Два обязательных условия (иначе блок сломает декой selfsteal):
#   1. схема http:// — без неё блок уйдёт на https_port 9443 и займёт
#      порт, на который mtg-proxy отдаёт не-VPN трафик
#   2. bind 0.0.0.0 — глобальный default_bind в этом конфиге равен
#      127.0.0.1, и без bind блок не примет внешние соединения
#
# Перед применением: в Cloudflare создать proxied (оранжевое облако)
# A-запись api.helloneo.uk -> 152.53.163.71. Оранжевое облако обязательно:
# оно и даёт HTTPS, и подставляет CF-Connecting-IP для rate limiter.
#
# Применение (admin API отключён, `caddy reload` не сработает):
#   docker compose -f /opt/caddy/docker-compose.yml restart caddy-selfsteal
# либо
#   docker restart caddy-selfsteal
# =========================================================

http://api.helloneo.uk {
	bind 0.0.0.0

	# CORS сознательно НЕ задаём здесь: список разрешённых origin живёт
	# в api/config.py (CORS_ORIGINS) и применяется CORSMiddleware. Дубль
	# с "*" на уровне Caddy перекрыл бы этот список и открыл API всем.

	header {
		-Server
		X-Content-Type-Options "nosniff"
		Referrer-Policy "no-referrer"
	}

	reverse_proxy 127.0.0.1:8001 {
		header_up X-Real-IP {remote_host}
		# Долгие ответы модели: дефолтных таймаутов не хватает
		transport http {
			read_timeout 120s
			write_timeout 120s
		}
	}

	log {
		output file /var/log/caddy/vnxoracle-api-access.log {
			roll_size 10MB
			roll_keep 5
		}
	}
}
