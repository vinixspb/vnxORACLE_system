# =========================================================
# vnxORACLE Web API - nginx Configuration
# =========================================================
# Проксирование API для работы с сайтом motionsites.ai
# Port: 8000 (internal) -> 443 (external via nginx)
# =========================================================

server {
    listen 80;
    server_name api.vnxoracle.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vnxoracle.com;

    # SSL Configuration (замените на ваши сертификаты)
    ssl_certificate /etc/letsencrypt/live/api.vnxoracle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vnxoracle.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS Headers для motionsites.ai и других доменов
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 3600 always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Logging
    access_log /var/log/nginx/vnxoracle-api-access.log;
    error_log /var/log/nginx/vnxoracle-api-error.log;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req zone=api_limit burst=10 nodelay;

    # Proxy to FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (на будущее)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (без rate limit)
    location /api/health {
        limit_req off;
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Documentation (опционально, можно закрыть для production)
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Закомментируйте для production:
        # auth_basic "API Documentation";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Block common attack vectors
    location ~ /\. {
        deny all;
    }
}

# =========================================================
# Альтернатива: Если нет выделенного поддомена
# =========================================================
# Можно добавить location в существующий server block:
#
# location /api/ {
#     proxy_pass http://127.0.0.1:8000/api/;
#     # ... остальные настройки ...
# }
# =========================================================
