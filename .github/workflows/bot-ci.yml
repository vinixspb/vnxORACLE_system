name: vnxORACLE Bot CI

on:
  push:
    branches:
      - develop-vnxoracle-bot
    paths:
      - "bot/**"
      - ".github/workflows/bot-ci.yml"
  pull_request:
    branches:
      - develop-vnxoracle-bot
    paths:
      - "bot/**"
      - ".github/workflows/bot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-video-ux-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install test dependency
        run: python -m pip install --upgrade pip "python-telegram-bot==20.7"

      - name: Compile bot Python files
        working-directory: bot
        run: python -m compileall -q .

      - name: Run Video AI UX keyboard tests
        working-directory: bot
        run: python -m unittest discover -s tests -v
