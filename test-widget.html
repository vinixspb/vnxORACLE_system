<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test vnxORACLE Chat Widget</title>
</head>
<body>
    <h1>Тест Chat Widget</h1>
    <button onclick="testChat()">Отправить тестовое сообщение</button>
    <pre id="result"></pre>

    <script>
        async function testChat() {
            const result = document.getElementById('result');
            result.textContent = 'Отправка...';

            try {
                const response = await fetch('https://api.vnxoracle.uk/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Привет! Что делает ваша компания?',
                        session_id: 'test-' + Date.now()
                    })
                });

                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                result.textContent = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
